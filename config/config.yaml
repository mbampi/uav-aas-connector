# config.yaml

aas:
  file_path: "assets/aas/quadcopter.json"

adapter:
  name: "mavlink"
  connection: "udp"
  address: "localhost:14550"
  config_file: "config/mappings/mavlink.yaml"

exporters:
  http:
    enabled: true
    port: 8080
    
  opcua:
    enabled: true
    port: 4840
  
advanced:
  log_level: "debug"
  max_retries: 3
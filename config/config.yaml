# config.yaml

aas:
  filePath: "config/aas/quadcopter.json"

adapter:
  type: "mavlink"
  connection: "udp"
  address: "0.0.0.0:14550"
  mappingFile: "config/mappings/mavlink.yaml"

exporters:
  dummy:
    enabled: true

  http:
    enabled: false
    port: 8080
    host: "localhost
    
  opcua:
    enabled: false
    port: 4840
    host: "localhost"
  
advanced:
  log_level: "debug"
  max_retries: 3
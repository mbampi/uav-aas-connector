# config.yaml

aas:
  filePath: "config/aas/quad_op.json"

adapter:
  type: "mavlink"
  mappingFile: "config/mappings/mavlink_ops.yaml"
  # - UART Connection:
  connection: "serial"
  address: "/dev/ttyAMA0"
  baudrate: 921600
  # - UDP Connection:
  # connection: "udp"
  # address: "0.0.0.0:14550"
  # - Radio Connection:
  # connection: "serial"
  # address: "/dev/ttyUSB0"
  # baudrate: 57600

exporters:
  dummy:
    enabled: false

  http:
    type: "http"
    enabled: false
    port: 8080
    host: "localhost"
    
  opcua_client:
    type: "opcua_client"
    enabled: true
    port: 4840
    host: "10.0.0.110"
  
  mqtt_broker:
    type: mqtt
    enabled: false
    host: "tcp://localhost:1883" 
    client_id: "uav-connector-01"
    topic_prefix: "aas/uav-1"

  opcua_server:
    type: "opcua_server"
    enabled: false
    port: 4840
    host: "localhost"
  
advanced:
  log_level: "debug"
  metrics_path: "metrics/"
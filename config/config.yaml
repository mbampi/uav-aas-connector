# config.yaml

aas:
  filePath: "config/aas/quadcopter.json"

adapter:
  type: "mavlink"
  connection: "udp"
  address: "127.0.0.1:14550"
  mappingFile: "config/mappings/mavlink.yaml"

exporters:
  dummy:
    enabled: true

  http:
    enabled: false
    port: 8080
    
  opcua:
    enabled: false
    port: 4840
  
advanced:
  log_level: "debug"
  max_retries: 3
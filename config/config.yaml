# config.yaml

aas:
  filePath: "config/aas/quad_op.json"

adapter:
  type: "mavlink"
  connection: "udp"
  address: "0.0.0.0:14550"
  mappingFile: "config/mappings/mavlink_ops.yaml"

exporters:
  dummy:
    enabled: false

  http:
    type: "http"
    enabled: false
    port: 8080
    host: "localhost"
    
  opcua:
    type: "opcua"
    enabled: true
    port: 4840
    host: "0.0.0.0"
  
advanced:
  log_level: "debug"
  max_retries: 3
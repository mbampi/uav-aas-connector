# config/mappings/mavlink_v2.yaml
#
# This file maps incoming MAVLink message fields to their target properties 
# in the improved AAS (Asset Administration Shell).
#
# Schema Changes:
# - 'targetAASCollection': (Optional) Specifies the SubmodelElementCollection 
#   if the property is nested inside one.

mappings:
  # ==============================================================================
  # 1. IDENTIFICATION (Remote ID)
  # ==============================================================================
  - sourceMessage: "OPEN_DRONE_ID_SYSTEM"
    sourceField: "OperatorLocationType"
    targetAASSubmodel: "Identification"
    targetAASCollection: "RemoteID_System"
    targetAASProperty: "OperatorLocationType"

  - sourceMessage: "OPEN_DRONE_ID_SYSTEM"
    sourceField: "UaType"
    targetAASSubmodel: "Identification"
    targetAASCollection: "RemoteID_System"
    targetAASProperty: "UAType"

  - sourceMessage: "OPEN_DRONE_ID_SYSTEM"
    sourceField: "ClassificationType"
    targetAASSubmodel: "Identification"
    targetAASCollection: "RemoteID_System"
    targetAASProperty: "ClassificationType"

  # ==============================================================================
  # 2. STATUS (HEARTBEAT)
  # ==============================================================================
  - sourceMessage: "HEARTBEAT"
    sourceField: "Type"
    targetAASSubmodel: "Status"
    targetAASProperty: "VehicleType"

  - sourceMessage: "HEARTBEAT"
    sourceField: "Autopilot"
    targetAASSubmodel: "Status"
    targetAASProperty: "AutopilotType"

  - sourceMessage: "HEARTBEAT"
    sourceField: "SystemStatus"
    targetAASSubmodel: "Status"
    targetAASProperty: "SystemStatus"

  # ==============================================================================
  # 3. POWER (SYS_STATUS)
  # ==============================================================================
  - sourceMessage: "SYS_STATUS"
    sourceField: "VoltageBattery"
    targetAASSubmodel: "Power"
    targetAASProperty: "Voltage"
    scale: "0.001" # mV -> V

  - sourceMessage: "SYS_STATUS"
    sourceField: "CurrentBattery"
    targetAASSubmodel: "Power"
    targetAASProperty: "Current"
    scale: "0.01" # cA -> A

  - sourceMessage: "SYS_STATUS"
    sourceField: "BatteryRemaining"
    targetAASSubmodel: "Power"
    targetAASProperty: "Remaining"

  - sourceMessage: "SYS_STATUS"
    sourceField: "Load"
    targetAASSubmodel: "Power"
    targetAASProperty: "CPULoad"
    scale: "0.1" # 1000 = 100% -> 0.1 scale? Standard is d% (1000 = 100.0%)

  - sourceMessage: "SYS_STATUS"
    sourceField: "DropRateComm"
    targetAASSubmodel: "Power"
    targetAASProperty: "DropRateComm"
    scale: "0.01" # c% -> %

  # ==============================================================================
  # 4. NAVIGATION (Global, Local, GPS, Terrain)
  # ==============================================================================
  
  # --- GlobalPosition Collection ---
  - sourceMessage: "GLOBAL_POSITION_INT"
    sourceField: "Lat"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "GlobalPosition"
    targetAASProperty: "Latitude"
    scale: "1e-7"

  - sourceMessage: "GLOBAL_POSITION_INT"
    sourceField: "Lon"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "GlobalPosition"
    targetAASProperty: "Longitude"
    scale: "1e-7"

  - sourceMessage: "GLOBAL_POSITION_INT"
    sourceField: "Alt"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "GlobalPosition"
    targetAASProperty: "AltitudeMSL"
    scale: "0.001" # mm -> m

  - sourceMessage: "GLOBAL_POSITION_INT"
    sourceField: "Hdg"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "GlobalPosition"
    targetAASProperty: "Heading"
    scale: "0.01" # cdeg -> deg

  # --- LocalPositionNED Collection ---
  - sourceMessage: "LOCAL_POSITION_NED"
    sourceField: "X"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "LocalPositionNED"
    targetAASProperty: "X"

  - sourceMessage: "LOCAL_POSITION_NED"
    sourceField: "Y"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "LocalPositionNED"
    targetAASProperty: "Y"

  - sourceMessage: "LOCAL_POSITION_NED"
    sourceField: "Z"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "LocalPositionNED"
    targetAASProperty: "Z"

  - sourceMessage: "LOCAL_POSITION_NED"
    sourceField: "Vx"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "LocalPositionNED"
    targetAASProperty: "VX"

  - sourceMessage: "LOCAL_POSITION_NED"
    sourceField: "Vy"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "LocalPositionNED"
    targetAASProperty: "VY"

  - sourceMessage: "LOCAL_POSITION_NED"
    sourceField: "Vz"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "LocalPositionNED"
    targetAASProperty: "VZ"

  # --- GPS_Raw Collection ---
  - sourceMessage: "GPS_RAW_INT"
    sourceField: "FixType"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "GPS_Raw"
    targetAASProperty: "FixType"

  - sourceMessage: "GPS_RAW_INT"
    sourceField: "SatellitesVisible"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "GPS_Raw"
    targetAASProperty: "SatellitesVisible"

  - sourceMessage: "GPS_RAW_INT"
    sourceField: "Eph" # Horizontal dilution of position
    targetAASSubmodel: "Navigation"
    targetAASCollection: "GPS_Raw"
    targetAASProperty: "HDOP"
    scale: "0.01" # cm -> m

  # --- TerrainData Collection ---
  - sourceMessage: "ALTITUDE"
    sourceField: "AltitudeTerrain"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "TerrainData"
    targetAASProperty: "TerrainAltitude"

  - sourceMessage: "ALTITUDE"
    sourceField: "BottomClearance"
    targetAASSubmodel: "Navigation"
    targetAASCollection: "TerrainData"
    targetAASProperty: "BottomClearance"

  # ==============================================================================
  # 5. ATTITUDE
  # ==============================================================================
  
  # --- EulerAngles Collection ---
  - sourceMessage: "ATTITUDE"
    sourceField: "Roll"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "EulerAngles"
    targetAASProperty: "Roll"

  - sourceMessage: "ATTITUDE"
    sourceField: "Pitch"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "EulerAngles"
    targetAASProperty: "Pitch"

  - sourceMessage: "ATTITUDE"
    sourceField: "Yaw"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "EulerAngles"
    targetAASProperty: "Yaw"

  - sourceMessage: "ATTITUDE"
    sourceField: "RollSpeed"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "EulerAngles"
    targetAASProperty: "RollSpeed"

  - sourceMessage: "ATTITUDE"
    sourceField: "PitchSpeed"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "EulerAngles"
    targetAASProperty: "PitchSpeed"

  - sourceMessage: "ATTITUDE"
    sourceField: "YawSpeed"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "EulerAngles"
    targetAASProperty: "YawSpeed"

  # --- Quaternion Collection ---
  - sourceMessage: "ATTITUDE_QUATERNION"
    sourceField: "Q1"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "Quaternion"
    targetAASProperty: "Q1"

  - sourceMessage: "ATTITUDE_QUATERNION"
    sourceField: "Q2"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "Quaternion"
    targetAASProperty: "Q2"

  - sourceMessage: "ATTITUDE_QUATERNION"
    sourceField: "Q3"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "Quaternion"
    targetAASProperty: "Q3"

  - sourceMessage: "ATTITUDE_QUATERNION"
    sourceField: "Q4"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "Quaternion"
    targetAASProperty: "Q4"

  # --- AttitudeTarget Collection ---
  - sourceMessage: "ATTITUDE_TARGET"
    sourceField: "BodyRollRate"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "AttitudeTarget"
    targetAASProperty: "BodyRollRate"

  - sourceMessage: "ATTITUDE_TARGET"
    sourceField: "BodyPitchRate"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "AttitudeTarget"
    targetAASProperty: "BodyPitchRate"

  - sourceMessage: "ATTITUDE_TARGET"
    sourceField: "BodyYawRate"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "AttitudeTarget"
    targetAASProperty: "BodyYawRate"

  - sourceMessage: "ATTITUDE_TARGET"
    sourceField: "Thrust"
    targetAASSubmodel: "Attitude"
    targetAASCollection: "AttitudeTarget"
    targetAASProperty: "Thrust"

  # ==============================================================================
  # 6. ACTUATION (Servo & ESC)
  # ==============================================================================

  # --- ServoOutput Collection ---
  - sourceMessage: "SERVO_OUTPUT_RAW"
    sourceField: "Servo1Raw"
    targetAASSubmodel: "Actuation"
    targetAASCollection: "ServoOutput"
    targetAASProperty: "Servo1"

  - sourceMessage: "SERVO_OUTPUT_RAW"
    sourceField: "Servo2Raw"
    targetAASSubmodel: "Actuation"
    targetAASCollection: "ServoOutput"
    targetAASProperty: "Servo2"

  - sourceMessage: "SERVO_OUTPUT_RAW"
    sourceField: "Servo3Raw"
    targetAASSubmodel: "Actuation"
    targetAASCollection: "ServoOutput"
    targetAASProperty: "Servo3"

  - sourceMessage: "SERVO_OUTPUT_RAW"
    sourceField: "Servo4Raw"
    targetAASSubmodel: "Actuation"
    targetAASCollection: "ServoOutput"
    targetAASProperty: "Servo4"

# --- ESC_Status Collection ---  
  - sourceMessage: "ESC_STATUS"
    sourceField: "Rpm[0]"       # Selects the first motor's RPM
    targetAASSubmodel: "Actuation"
    targetAASCollection: "ESC_Status"
    targetAASProperty: "RPM"

  - sourceMessage: "ESC_STATUS"
    sourceField: "Voltage[0]"   # Selects the first motor's Voltage
    targetAASSubmodel: "Actuation"
    targetAASCollection: "ESC_Status"
    targetAASProperty: "Voltage"

  - sourceMessage: "ESC_STATUS"
    sourceField: "Current[0]"   # Selects the first motor's Current
    targetAASSubmodel: "Actuation"
    targetAASCollection: "ESC_Status"
    targetAASProperty: "Current"

  # ==============================================================================
  # 7. HUD
  # ==============================================================================
  - sourceMessage: "VFR_HUD"
    sourceField: "Airspeed"
    targetAASSubmodel: "HUD"
    targetAASProperty: "Airspeed"

  - sourceMessage: "VFR_HUD"
    sourceField: "Groundspeed"
    targetAASSubmodel: "HUD"
    targetAASProperty: "Groundspeed"

  - sourceMessage: "VFR_HUD"
    sourceField: "Heading"
    targetAASSubmodel: "HUD"
    targetAASProperty: "Heading"

  - sourceMessage: "VFR_HUD"
    sourceField: "Throttle"
    targetAASSubmodel: "HUD"
    targetAASProperty: "Throttle"

  - sourceMessage: "VFR_HUD"
    sourceField: "Alt"
    targetAASSubmodel: "HUD"
    targetAASProperty: "Altitude"

  - sourceMessage: "VFR_HUD"
    sourceField: "Climb"
    targetAASSubmodel: "HUD"
    targetAASProperty: "ClimbRate"
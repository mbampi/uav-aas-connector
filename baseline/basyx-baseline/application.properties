## BaSyx AAS Environment config - naive/out-of-the-box baseline
##
## Mounted into the container at /application/application.properties (the
## path the eclipsebasyx/aas-environment image reads by default). Deliberately
## minimal: no MongoDB, no separate AAS/Submodel registries, no auth, no CORS
## lockdown, no batching/caching feature flags - the "practitioner points the
## official Docker image at a config file and runs it" baseline, matching
## python-baseline-conn's naive framing (see ../README.md).

server.port=8081
spring.application.name=BaSyx-UAV-Baseline

# In-memory backend: everything is lost on restart, but it is BaSyx's default
# backend and requires no extra container (no MongoDB) - the simplest,
# out-of-the-box deployment mode, and the fairest comparison point since the
# Go connector and the python-baseline-conn gateway are also single, stateless
# processes with no external database of their own.
basyx.backend=InMemory

# Preconfigures the AAS Environment at startup from every AAS/Submodel
# serialization file found in this directory (recursively scanned) - see
# ./aas_definitions/uav_environment.json, converted from the connector's own
# config/aas/quad_op.json (same 7 submodels, same idShort/id values).
basyx.environment=file:/application/aas

## ---------------------------------------------------------------------
## MQTT eventing - BaSyx publishes one message per SubmodelElement value
## change to this broker. EDIT mqtt.hostname to your MacBook's LAN IP
## before starting the Pi-side stack (see README.md Phase 1).
## ---------------------------------------------------------------------
mqtt.clientId=basyx-uav-baseline
mqtt.hostname=192.168.0.16
mqtt.port=1883
basyx.aasrepository.feature.mqtt.enabled=true
basyx.submodelrepository.feature.mqtt.enabled=true

# Wide open - matches the SecurityMode=None / anonymous-auth posture the
# other baseline variants and the connector's own default config use (see
# ../README.md "Baseline Validity Notes" in the parent baseline/README.md).
basyx.cors.allowed-origins=*
basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD

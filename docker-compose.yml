services:
  uav-aas-connector:
    build: .
    container_name: uav-aas-connector
    restart: unless-stopped
    
    # Mount the local config directory into the container.
    # This allows you to edit mappings/json on your host and 
    # simply restart the container to apply changes.
    volumes:
      - ./config:/app/config
      - ./metrics:/app/metrics

    ports:
      # Input: MAVLink
      - "14550:14550/udp"
      
      # Output: HTTP Exporter
      - "8080:8080"
      
      # Output: OPC UA Exporter
      - "4840:4840"

    # 'host' network mode is faster for high-frequency UDP as it bypasses the Docker NAT. 
    # network_mode: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    command:
      - "-housekeeping_interval=500ms"
      - "-docker_only=true"
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8081:8080"
    devices:
      - /dev/kmsg
